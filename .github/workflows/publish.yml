name: Publish portfolio

# Builds the portfolio straight from this repository and publishes it to
# GitHub Pages, so a push is all it takes to update the live site.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Prepare files for Pages
        run: |
          # The owner-only editing control needs a server, which Pages does not have.
          sed -i 's#</head>#<style>.owner-link{display:none !important}</style></head>#' dist/index.html
          touch dist/.nojekyll
          grep -q 'owner-link{display:none' dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4
