name: Publish portfolio

# Pulls the portfolio from its source site and publishes it to GitHub Pages.
# Change SOURCE below if the portfolio's source address ever changes.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE: https://k-pranav-digital-world-l65015.freebuff.site/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the portfolio
        run: |
          mkdir -p site
          wget --quiet --mirror --page-requisites --no-parent \
            --no-host-directories --directory-prefix=site \
            --reject-regex '/api/' "$SOURCE"
          wget --quiet "${SOURCE}og.svg" -O site/og.svg || true
          # The owner-only editing control needs a server, which Pages does not have.
          sed -i 's#</head>#<style>.owner-link{display:none !important}</style></head>#' site/index.html
          touch site/.nojekyll
          ls -la site
          test -f site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
