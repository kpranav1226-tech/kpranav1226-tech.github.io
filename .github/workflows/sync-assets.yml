name: Sync source assets

# One-off helper: rebuilds package-lock.json from its verified transport chunks.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble lockfile
        run: |
          cat lock.part1 lock.part2 lock.part3 | base64 -d | gunzip > package-lock.json
          md5sum package-lock.json
          test "$(md5sum package-lock.json | cut -d' ' -f1)" = "2d535ccbbe437cafc4ecd5b278f0f32f"
          head -3 package-lock.json
          rm lock.part1 lock.part2 lock.part3

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Store the real dependency lockfile"
          git push
