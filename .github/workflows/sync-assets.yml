name: Sync source assets

# One-off helper: restores package-lock.json as plain JSON from its compressed
# form, then removes itself from the repository.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decompress lockfile
        run: |
          gzip -dc package-lock.json > /tmp/package-lock.json
          mv /tmp/package-lock.json package-lock.json
          md5sum package-lock.json
          test "$(md5sum package-lock.json | cut -d' ' -f1)" = "2d535ccbbe437cafc4ecd5b278f0f32f"
          head -3 package-lock.json

      - name: Commit and retire this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-assets.yml
          git add package-lock.json
          git commit -m "Store the dependency lockfile as plain JSON"
          git push
